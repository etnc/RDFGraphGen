name: Build and Release

# Publishes a new version on PyPI when a version tag is pushed, e.g.:
#   git tag v1.3.0 && git push origin v1.3.0
# The tag must match __version__ in rdf_graph_gen/__init__.py (v1.3.0 or v1.3 for version 1.3.0).
on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys
          text = pathlib.Path("rdf_graph_gen/__init__.py").read_text()
          version = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if "dev" in version:
              sys.exit(f"Refusing to release development version {version}")
          accepted = {"v" + version}
          if version.endswith(".0"):
              accepted.add("v" + version[:-2])  # also accept short tags such as v1.3 for version 1.3.0
          if tag not in accepted:
              sys.exit(f"Tag {tag} does not match the package version {version}")
          print(f"Releasing version {version} from tag {tag}")
          EOF

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
