name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # reused by the release workflow

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Python 3.9 is end-of-life and is not available for the newest Ubuntu runner image,
          # so it is tested on the previous LTS image.
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run the test suite
        run: python -m pytest

      - name: Smoke-test the installed rdfgen command
        working-directory: ${{ runner.temp }}
        run: |
          rdfgen --version
          rdfgen "$GITHUB_WORKSPACE/experiment_suite/shape-single-simple.ttl" smoke-test.ttl 50 --validate
