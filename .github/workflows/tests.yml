name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # reused by the release workflow

# Actions are pinned to the commit of a release (the comment gives its version)
jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Python 3.9 is end-of-life and is not available for the newest Ubuntu runner image,
          # so it is tested on the previous LTS image.
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run the test suite
        run: python -m pytest

      - name: Smoke-test the installed rdfgen command
        working-directory: ${{ runner.temp }}
        run: |
          rdfgen --version
          rdfgen "$GITHUB_WORKSPACE/experiment_suite/shape-single-simple.ttl" smoke-test.ttl 50 --seed 1 --validate

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Run ruff
        run: |
          python -m pip install ruff
          ruff check .
